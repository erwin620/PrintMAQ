<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>007 · Render</title>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#000;}</style>
</head>
<body>
<script src="screens.js"></script>
<script>
  var q = new URLSearchParams(location.search);
  var page = q.get("p") || "main";
  var pressed = q.get("pressed") === "1";
  var bg = q.get("bg") === "1";
  var lang = q.get("lang") === "es" ? "es" : "en";
  document.body.appendChild(window.PM_SCREENS.build(page, { pressed: pressed, bg: bg, lang: lang }));
</script>
</body>
</html>
